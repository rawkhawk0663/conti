# Baut Conti automatisch bei jeder Änderung auf "main" und stellt die
# fertigen Dateien unter "Releases" zum Herunterladen bereit.
# Conti ist Open Source: Code und Downloads liegen im selben Projekt.
name: Build

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

env:
  FLUTTER_VERSION: "3.47.9"
  # Vorderer Teil der Versionsnummer. Die letzte Zahl ist die laufende Nummer
  # des Builds (zählt immer weiter, darauf verlässt sich die Update-Suche).
  VERSION_PREFIX: "0.1"

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Prüfen & Testen
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true
      - run: flutter pub get
      - run: flutter analyze
      - run: flutter test

  # Legt einen noch unsichtbaren Release-Entwurf an. Die Builds laden ihre
  # Dateien direkt dort hinein (nicht in den Zwischenspeicher von GitHub
  # Actions, dessen Platz im Konto begrenzt ist).
  draft:
    name: Entwurf anlegen
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Release-Entwurf anlegen
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG="v${{ env.VERSION_PREFIX }}.${{ github.run_number }}"
          gh release create "$TAG" --draft \
            --repo "${{ github.repository }}" \
            --target "${{ github.sha }}" \
            --title "Conti $TAG" \
            --notes "Wird gebaut …"

  windows:
    name: Windows-Build
    needs: [draft]
    # Läuft auch bei Pull Requests (dann ohne Entwurf und ohne Hochladen).
    if: ${{ !cancelled() && needs.draft.result != 'failure' }}
    runs-on: windows-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true
      # Schlüssel der Dropbox-App (Geheimnis DROPBOX_APP_KEY). Fehlt er, ist
      # der Abgleich in dieser Version ausgegraut.
      - run: flutter build windows --release --build-name=${{ env.VERSION_PREFIX }}.${{ github.run_number }} --build-number=${{ github.run_number }} --dart-define=CONTI_VERSION=v${{ env.VERSION_PREFIX }}.${{ github.run_number }} --dart-define=DROPBOX_APP_KEY=${{ secrets.DROPBOX_APP_KEY }}
      - name: ZIP erstellen
        shell: pwsh
        run: |
          Compress-Archive -Path build/windows/x64/runner/Release/* -DestinationPath Conti-Windows.zip
      # Installationsprogramm (Inno Setup): Startmenü, Deinstallieren in den
      # Windows-Einstellungen. Die ZIP-Datei bleibt für die Updates in der App.
      - name: Installationsprogramm erstellen
        shell: pwsh
        run: |
          $iscc = "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe"
          if (-not (Test-Path $iscc)) { choco install innosetup -y --no-progress | Out-Null }
          # Deutsche Texte in Schweizer Schreibweise (ss statt ß).
          $isl = "${env:ProgramFiles(x86)}\Inno Setup 6\Languages\German.isl"
          $bytes = [IO.File]::ReadAllBytes($isl)
          $out = "windows\installer\German-CH.isl"
          if ($bytes.Length -ge 3 -and $bytes[0] -eq 0xEF -and $bytes[1] -eq 0xBB -and $bytes[2] -eq 0xBF) {
            $text = [IO.File]::ReadAllText($isl, [Text.UTF8Encoding]::new($true))
            [IO.File]::WriteAllText($out, $text.Replace([string][char]0xDF, 'ss'), [Text.UTF8Encoding]::new($true))
          } else {
            Copy-Item $isl $out
          }
          & $iscc "/DAppVersion=${{ env.VERSION_PREFIX }}.${{ github.run_number }}" windows\installer\conti.iss
          if ($LASTEXITCODE -ne 0) { exit 1 }
          Copy-Item build\installer\Conti-Setup.exe Conti-Setup.exe
      - name: In den Entwurf hochladen
        if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release upload "v${{ env.VERSION_PREFIX }}.${{ github.run_number }}" Conti-Windows.zip Conti-Setup.exe --repo "${{ github.repository }}" --clobber

  android:
    name: Android-Build
    needs: [draft]
    if: ${{ !cancelled() && needs.draft.result != 'failure' }}
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true
      # Mit festem Schlüssel signieren, damit Updates über die installierte
      # App gehen (Geheimnisse CONTI_KEYSTORE und CONTI_KEYSTORE_PASSWORD).
      # Bricht beim Herunterladen von Android-Teilen die Verbindung ab, einmal
      # nochmals versuchen (bereits Geladenes bleibt erhalten).
      - name: Android-App bauen
        env:
          CONTI_KEYSTORE: ${{ secrets.CONTI_KEYSTORE }}
          CONTI_KEYSTORE_PASSWORD: ${{ secrets.CONTI_KEYSTORE_PASSWORD }}
          DROPBOX_APP_KEY: ${{ secrets.DROPBOX_APP_KEY }}
        run: |
          if [ -z "$CONTI_KEYSTORE" ]; then echo "::warning::Kein Signier-Schlüssel hinterlegt – Test-Schlüssel wird verwendet."; fi
          ARGS="--release --build-name=${{ env.VERSION_PREFIX }}.${{ github.run_number }} --build-number=${{ github.run_number }} --dart-define=CONTI_VERSION=v${{ env.VERSION_PREFIX }}.${{ github.run_number }} --dart-define=DROPBOX_APP_KEY=$DROPBOX_APP_KEY"
          flutter build apk $ARGS || (echo "Zweiter Versuch …" && sleep 30 && flutter build apk $ARGS)
      - run: cp build/app/outputs/flutter-apk/app-release.apk Conti-Android.apk
      - name: In den Entwurf hochladen
        if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release upload "v${{ env.VERSION_PREFIX }}.${{ github.run_number }}" Conti-Android.apk --repo "${{ github.repository }}" --clobber

  release:
    name: Zum Download bereitstellen
    # Nur für "main"; Android ist optional – ein Android-Fehler blockiert
    # den Windows-Download nicht. Ohne Windows wird der Entwurf weggeräumt.
    if: ${{ !cancelled() && needs.draft.result == 'success' }}
    needs: [draft, test, windows, android]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Release veröffentlichen
        env:
          GH_TOKEN: ${{ github.token }}
          COMMIT_MSG: ${{ github.event.head_commit.message }}
          OK: ${{ needs.test.result == 'success' && needs.windows.result == 'success' }}
        run: |
          TAG="v${{ env.VERSION_PREFIX }}.${{ github.run_number }}"
          if [ "$OK" != "true" ]; then
            echo "Prüfen oder Windows-Build fehlgeschlagen – Entwurf wird gelöscht."
            gh release delete "$TAG" --repo "${{ github.repository }}" --yes || true
            exit 1
          fi
          MSG=$(printf '%s' "$COMMIT_MSG" | head -1)
          cat > notes.md <<EOT
          **Neu / New:** ${MSG:-Verbesserungen}

          ### Installieren
          **Windows 10/11:** \`Conti-Setup.exe\` herunterladen und starten. Meldet Windows „Der Computer wurde durch Windows geschützt“: *Weitere Informationen → Trotzdem ausführen*. Ohne Installation: \`Conti-Windows.zip\` entpacken und \`Conti.exe\` starten.
          **Android:** \`Conti-Android.apk\` auf dem Handy herunterladen und öffnen (Installation aus dieser Quelle erlauben).
          Ist Conti schon installiert, kommt das Update in der App: *Einstellungen → Über Conti → Nach Updates suchen*.

          ### Install
          **Windows 10/11:** download and run \`Conti-Setup.exe\`. If Windows says "Windows protected your PC": *More info → Run anyway*. Without installing: unzip \`Conti-Windows.zip\` and run \`Conti.exe\`.
          **Android:** download \`Conti-Android.apk\` on your phone and open it (allow installing from this source).
          If Conti is already installed, update right in the app: *Settings → About Conti → Check for updates*.
          EOT
          sed -i 's/^          //' notes.md
          gh release edit "$TAG" \
            --repo "${{ github.repository }}" \
            --notes-file notes.md \
            --draft=false --prerelease=false --latest
